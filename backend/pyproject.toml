[project]
name = "wealth"
version = "0.1.0"
description = "Secure wealth-advisor agent: schema, mock data, access-controlled tools, agent loop"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.8",
    "anthropic>=0.40",
    "faker>=30.0",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
wealth-agent = "wealth.agent.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wealth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["seeded: runs against the generated dev database (needs `python -m wealth.datagen` first)"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Line length is enforced by `ruff format`; long SQL and prompt strings are left intact.
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are meant to be used as argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.params.Depends"]

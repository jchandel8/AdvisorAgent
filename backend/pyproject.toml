[project]
name = "wealth"
version = "0.1.0"
description = "Secure wealth-advisor agent: schema, mock data, access-controlled tools, agent loop"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.8",
    "anthropic>=0.40",
    "faker>=30.0",
    "python-dotenv>=1.0",
]

[project.scripts]
wealth-agent = "wealth.agent.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wealth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["seeded: runs against the generated dev database (needs `python -m wealth.datagen` first)"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Line length is enforced by `ruff format`; long SQL and prompt strings are left intact.
ignore = ["E501"]

# Runs on every push and pull request: backend lint + tests (with a real Postgres), frontend tests + build.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: advisor_app
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: wealth
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U advisor_app -d wealth" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://advisor_app:ci-only-password@localhost:5432/wealth
      AUTH_MODE: demo
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python -m wealth.datagen   # seeds the database the seeded tests read
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx ng test --watch=false
      - run: npx ng build --configuration production

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AdvisorAgent</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Wealth advisor and client portals with an access-controlled AI assistant.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Apply the saved theme before first paint so the page never flashes the wrong theme.
    try {
      var t = localStorage.getItem('advisoragent.theme');
      document.documentElement.dataset['theme'] = t === 'dark' ? 'dark' : 'light';
    } catch (e) { document.documentElement.dataset['theme'] = 'light'; }
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>

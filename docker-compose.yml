services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: advisor_app
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: wealth
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U advisor_app -d wealth"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:

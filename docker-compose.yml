# Local development: `docker compose up` starts Postgres, a local S3 for uploaded documents, the API and the
# web app.
#   Advisor portal: http://localhost:4200/advisor   Client portal: http://localhost:4200/client
# Secrets (ANTHROPIC_API_KEY) come from .env, which is never committed.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: advisor_app
      POSTGRES_PASSWORD: localdev   # local-only container password; AWS uses Secrets Manager (step 5)
      POSTGRES_DB: wealth
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U advisor_app -d wealth"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Stands in for Amazon S3 locally (uploaded documents). Same boto3 code; only the endpoint differs.
  # No real keys: it accepts any. Files are kept in the s3data volume.
  s3:
    image: adobe/s3mock:3.12.0
    environment:
      initialBuckets: advisoragent-documents-local
      root: /data
      retainFilesOnExit: "true"
    volumes:
      - s3data:/data

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://advisor_app:localdev@db:5432/wealth
      AUTH_MODE: ${AUTH_MODE:-demo}   # demo = local user picker (refused on AWS); cognito = real sign-in
      DOCUMENTS_BUCKET: advisoragent-documents-local
      S3_ENDPOINT_URL: http://s3:9090
      S3_ACCESS_KEY_ID: local
      S3_SECRET_ACCESS_KEY: local
    # Apply migrations, load the seed data if the database is empty, then serve with live reload.
    command: >
      sh -c "python -m wealth.migrate && python -m wealth.datagen --if-empty &&
             uvicorn wealth.api.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src"
    volumes:
      - ./backend/src:/app/src
      - ./backend/db:/app/db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_started

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npx ng serve --host 0.0.0.0 --port 4200 --proxy-config proxy.conf.json"
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    ports:
      - "4200:4200"
    depends_on:
      - api

  # Browser tests: docker compose --profile e2e run --rm e2e
  e2e:
    profiles: ["e2e"]
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    working_dir: /e2e
    environment:
      E2E_BASE_URL: http://web:4200
      E2E_AUTH: ${E2E_AUTH:-demo}
    env_file: .env
    volumes:
      - ./e2e:/e2e
      - e2e_node_modules:/e2e/node_modules
    command: sh -c "npm install --no-audit --no-fund && npx playwright test"
    depends_on:
      - web

volumes:
  pgdata:
  s3data:
  web_node_modules:
  e2e_node_modules:

